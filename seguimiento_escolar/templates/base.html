<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Sistema de Seguimiento Escolar — ES63{% endblock %}</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.6;
            color: #2d3748;
            background-color: #f7fafc;
        }

        header {
            background-color: #2b6cb0;
            color: #fff;
            padding: 1rem;
        }

        header .contenedor {
            max-width: 960px;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 0.5rem;
        }

        header h1 {
            font-size: 1.15rem;
            font-weight: 600;
        }

        header nav a {
            color: #fff;
            text-decoration: none;
            margin-left: 1rem;
        }

        header nav a:hover {
            text-decoration: underline;
        }

        main {
            max-width: 960px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .aviso {
            background-color: #ebf4ff;
            border-left: 4px solid #3182ce;
            padding: 1rem;
            border-radius: 4px;
            margin-bottom: 1rem;
        }

        footer {
            text-align: center;
            padding: 1.5rem 1rem;
            color: #718096;
            font-size: 0.875rem;
        }

        @media (max-width: 600px) {
            header .contenedor {
                flex-direction: column;
                text-align: center;
            }

            header nav a {
                margin-left: 0;
                margin-right: 1rem;
            }
        }
    </style>
</head>
<body>

<header>
    <div class="contenedor">
        <h1>Sistema de Seguimiento Escolar — ES63</h1>
        {% if user.is_authenticated %}
        <nav>
            <span>{{ user.get_full_name|default:user.username }}</span>
            <form action="{% url 'usuarios:logout' %}" method="post" style="display:inline;">
                {% csrf_token %}
                <button type="submit" style="background:none;border:none;color:#fff;cursor:pointer;text-decoration:underline;">Cerrar sesión</button>
            </form>
        </nav>
        {% endif %}
    </div>
</header>

<main>
    {% block content %}{% endblock %}

    {% if mensaje %}
    <div class="aviso">{{ mensaje }}</div>
    {% endif %}
</main>

<footer>
    <p>Escuela Secundaria N.º 63 — Sistema de alerta temprana | En desarrollo</p>
</footer>

</body>
</html>
